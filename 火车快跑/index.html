<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>train</title>
    <link rel="stylesheet" href="https://courseware.doubanjiang.com/production/style.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --hud-cream: #fff7c7;
            --hud-gold: #ffc847;
            --hud-orange: #f07a24;
            --hud-brown: #67230f;
            --hud-shadow: rgba(61, 25, 8, 0.42);
        }
        body {
            overflow: hidden;
            background: #000;
        }
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .start_button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        .overlay h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .overlay p {
            color: white;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .game-hud {
            position: absolute;
            top: 8px;
            right: 14px;
            display: none;
            align-items: center;
            gap: 18px;
            z-index: 60;
            white-space: nowrap;
        }
        .countdown-score {
            height: 48px;
            display: flex;
            align-items: center;
            gap: 22px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
        .end-game-button {
            position: relative;
            height: 38px;
            display: none;
            align-items: center;
            gap: 7px;
            padding: 0 12px 0 10px;
            border: 2px solid rgba(103, 35, 15, 0.72);
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255, 247, 199, 0.88) 0%, rgba(244, 200, 83, 0.8) 100%);
            color: #6b351d;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.58),
                0 2px 4px rgba(61, 25, 8, 0.25);
            cursor: pointer;
            font: 800 15px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.48);
            opacity: 0.82;
            transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .end-game-button::before,
        .end-game-button::after {
            display: none;
        }
        .end-game-button:hover {
            transform: translateY(-1px);
            opacity: 1;
        }
        .end-game-button:active {
            transform: translateY(1px);
            box-shadow:
                inset 0 1px 2px rgba(61, 25, 8, 0.18),
                0 1px 2px rgba(61, 25, 8, 0.2);
        }
        .report-icon {
            position: relative;
            width: 17px;
            height: 21px;
            flex: 0 0 auto;
            border: 2px solid currentColor;
            border-radius: 3px;
            background: rgba(255, 250, 205, 0.45);
        }
        .report-icon::before {
            content: "";
            position: absolute;
            left: 3px;
            top: 4px;
            width: 7px;
            height: 3px;
            border-top: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            box-shadow: 0 4px 0 -1px currentColor;
        }
        .report-action-button {
            min-width: 168px;
            height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 0 24px;
            border: 3px solid #68230f;
            border-radius: 10px;
            background: linear-gradient(180deg, #fff5b8 0%, #ffd24f 55%, #f28a2a 100%);
            color: #5b1d0c;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.72),
                0 4px 0 #9e3d17,
                0 7px 12px rgba(61, 25, 8, 0.3);
            cursor: pointer;
            font: 900 21px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 1px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .report-action-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.04) saturate(1.04);
        }
        .report-action-button:active {
            transform: translateY(3px);
            box-shadow:
                inset 0 2px 2px rgba(91, 29, 12, 0.14),
                0 1px 0 #9e3d17,
                0 3px 6px rgba(61, 25, 8, 0.24);
        }
        .report-action-button:focus-visible {
            outline: 3px solid #fff8cf;
            outline-offset: 3px;
        }
        .report-narration-status {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        /* 爱心显示区域 */
        .hearts-container {
            display: flex;
            gap: 1px;
            pointer-events: none;
        }
        .heart {
            width: 48px;
            height: 48px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        @media (max-width: 760px) {
            .game-hud {
                top: 5px;
                right: 6px;
                gap: 6px;
            }
            .hearts-container {
                gap: 0;
            }
            .heart {
                width: 30px;
                height: 30px;
            }
            .countdown-score {
                height: 34px;
                gap: 8px;
                font-size: 16px;
            }
            .end-game-button {
                width: 40px;
                height: 34px;
                justify-content: center;
                padding: 0;
                border-width: 2px;
                border-radius: 10px;
                box-shadow:
                    inset 0 2px 0 rgba(255, 255, 255, 0.75),
                    0 3px 0 #9b3c16,
                    0 4px 7px var(--hud-shadow);
            }
            .report-button-label {
                display: none;
            }
            .report-icon {
                width: 17px;
                height: 21px;
                border-width: 2px;
            }
            .report-action-button {
                min-width: 142px;
                height: 44px;
                padding: 0 18px;
                font-size: 18px;
                border-width: 2px;
            }
        }
        /* 加载界面样式 */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .loading-text {
            color: white;
            font-size: 32px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .loading-bar {
            width: 300px;
            height: 20px;
            background: #555;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .loading-progress {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }
        .loading-percent {
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- 加载界面 -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-text">Loading...</div>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
        <div class="loading-percent" id="loadingPercent">0%</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    <div class="game-hud">
        <button id="endGameButton" class="end-game-button" type="button" aria-label="进入学习报告">
            <span class="report-icon" aria-hidden="true"></span>
            <span class="report-button-label">学习报告</span>
        </button>
        <div class="countdown-score">
            <div id="scoreDisplay">Score: 0</div>
            <div id="timeDisplay">Time: 60s</div>
        </div>
        <!-- 爱心显示区域：保持在顶部信息组的最右侧 -->
        <div class="hearts-container" id="heartsContainer">
            <div class="heart" style="background-image: url('assets/aixin.png');"></div>
            <div class="heart" style="background-image: url('assets/aixin.png');"></div>
            <div class="heart" style="background-image: url('assets/aixin.png');"></div>
            <div class="heart" style="background-image: url('assets/aixin.png');"></div>
            <div class="heart" style="background-image: url('assets/aixin.png');"></div>
        </div>
    </div>
    
    <!-- 开始按钮 -->
    <button class="start_button" onclick="startGame()">开始游戏</button>
    
    <script src="./game-tracker.js"></script>
    <script src="play.js"></script>
</body>
</html>
