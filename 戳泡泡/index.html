<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <title>Game</title>
    <style>
        :root {
            --report-button-start: rgba(197, 246, 247, 0.5);
            --report-button-end: rgba(68, 193, 206, 0.36);
            --report-button-edge: rgba(5, 103, 128, 0.32);
            --report-button-text: rgba(4, 69, 91, 0.84);
            --report-button-shadow: rgba(5, 86, 116, 0.12);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .game-hud-stack {
            position: absolute;
            top: 3.5vh;
            right: 3.5vw;
            width: clamp(108px, 6.7vw, 128px);
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 119;
        }
        .game-info-strip {
            position: relative;
            width: 100%;
            height: clamp(66px, 8.7vh, 78px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--report-button-text);
            background: linear-gradient(145deg, var(--report-button-start), var(--report-button-end));
            border: 1px solid var(--report-button-edge);
            border-radius: 11px;
            box-shadow: 0 2px 6px var(--report-button-shadow), inset 0 1px 0 rgba(226, 255, 253, 0.34);
            backdrop-filter: blur(4px) saturate(1.02);
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            font-size: clamp(14px, 1.05vw, 18px);
            font-weight: 700;
            line-height: 1.15;
            text-align: center;
            z-index: 119;
            pointer-events: none;
        }
        .game-info-row {
            width: calc(100% - 14px);
            min-height: 0;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }
        .game-info-row + .game-info-row {
            border-top: 1px solid rgba(9, 111, 140, 0.12);
        }
        .game-info-label {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .game-info-marker {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 50%;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 1px 2px rgba(5, 86, 116, 0.1);
        }
        .level-marker {
            background: rgba(242, 189, 85, 0.72);
        }
        .score-marker {
            background: rgba(57, 171, 194, 0.65);
        }
        .game-info-value {
            min-width: 27px;
            padding: 1px 5px;
            border-radius: 7px;
            background: rgba(230, 252, 253, 0.22);
            box-shadow: inset 0 0 0 1px rgba(9, 111, 140, 0.07);
            text-align: center;
        }
        .game-info-strip span,
        .game-info-strip strong {
            white-space: nowrap;
        }
        .learning-report-button {
            position: relative;
            width: 100%;
            height: clamp(34px, 4.2vh, 39px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 6px;
            color: var(--report-button-text);
            background: linear-gradient(145deg, var(--report-button-start), var(--report-button-end));
            border: 1px solid var(--report-button-edge);
            border-radius: 11px;
            box-shadow: 0 2px 6px var(--report-button-shadow), inset 0 1px 0 rgba(226, 255, 253, 0.34);
            backdrop-filter: blur(4px) saturate(1.02);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: clamp(12px, 0.88vw, 15px);
            font-weight: 700;
            line-height: 1.25;
            text-align: center;
            cursor: pointer;
            z-index: 120;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            touch-action: manipulation;
        }
        .learning-report-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 4px 9px rgba(5, 86, 116, 0.17), inset 0 1px 0 rgba(226, 255, 253, 0.44);
        }
        .learning-report-button:active {
            transform: translateY(1px) scale(0.98);
        }
        .learning-report-button:focus-visible {
            outline: 3px solid rgba(7, 83, 107, 0.8);
            outline-offset: 3px;
        }
        .learning-report-button svg {
            width: clamp(17px, 1.15vw, 20px);
            height: auto;
            flex: 0 0 auto;
            opacity: 0.82;
            filter: none;
        }
        .learning-report-button span {
            white-space: nowrap;
        }
        @media (prefers-reduced-motion: reduce) {
            .learning-report-button {
                transition: none;
            }
        }
        .report-replay-button {
            width: 138px;
            height: 48px;
            color: #07506f;
            background: linear-gradient(145deg, #d5f3ff, #8bcdea);
            border: 2px solid #65afd2;
            border-radius: 9px;
            box-shadow: 0 5px 12px rgba(42, 137, 181, 0.3), inset 0 2px 0 rgba(239, 251, 255, 0.72);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .report-replay-button:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 8px 16px rgba(42, 137, 181, 0.38), inset 0 2px 0 rgba(239, 251, 255, 0.82);
        }
        .report-replay-button:active {
            transform: translateX(-50%) translateY(1px);
        }
        .report-manual-actions {
            position: absolute;
            bottom: 70px;
            left: 50%;
            display: flex;
            gap: 14px;
            transform: translateX(-50%);
        }
        .report-manual-button {
            width: 118px;
            height: 42px;
            border-radius: 8px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .report-continue-button {
            color: #ffffff;
            background: linear-gradient(145deg, #64bce7, #318fd0);
            border: 2px solid #277db7;
            box-shadow: 0 4px 10px rgba(35, 119, 171, 0.28);
        }
        .report-manual-replay-button {
            color: #07506f;
            background: linear-gradient(145deg, #d9f4ff, #9fd6ee);
            border: 2px solid #70b8d7;
            box-shadow: 0 4px 10px rgba(42, 137, 181, 0.24);
        }
        .report-manual-button:hover {
            transform: translateY(-2px);
        }
        .report-manual-button:active {
            transform: translateY(1px);
        }
        .start_button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 60px;
            font-size: 36px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #4a90d9, #2563eb);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .start_button:hover {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            transform: translate(-50%, -50%) translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 50, 100, 0.5);
            backdrop-filter: blur(5px);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        .overlay .card {
            background: linear-gradient(135deg, #4a90d9, #2563eb);
            border-radius: 20px;
            padding: 40px 80px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
        }
        .overlay h1 {
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .overlay p {
            font-size: 32px;
            margin: 0;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        .blur-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(128, 128, 128, 0.3);
            backdrop-filter: blur(5px);
            z-index: 49;
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.1);
            border-top: 8px solid #4a90d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 30px;
            font-size: 28px;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .loading-progress {
            margin-top: 20px;
            font-size: 20px;
            color: #4a90d9;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="game-hud-stack" id="gameHudStack">
        <div class="game-info-strip" id="gameInfoStrip" aria-label="游戏状态">
            <div class="game-info-row">
                <span class="game-info-label"><i class="game-info-marker level-marker" aria-hidden="true"></i>Level</span>
                <strong class="game-info-value" id="levelInfo">0</strong>
            </div>
            <div class="game-info-row">
                <span class="game-info-label"><i class="game-info-marker score-marker" aria-hidden="true"></i>Score</span>
                <strong class="game-info-value" id="scoreInfo">0</strong>
            </div>
        </div>
        <button class="learning-report-button" id="learningReportBtn" type="button" aria-label="打开学习报告">
            <svg viewBox="0 0 28 32" aria-hidden="true">
                <path d="M5 2.5h18a2.5 2.5 0 0 1 2.5 2.5v22a2.5 2.5 0 0 1-2.5 2.5H5A2.5 2.5 0 0 1 2.5 27V5A2.5 2.5 0 0 1 5 2.5Z" fill="none" stroke="currentColor" stroke-width="3"/>
                <path d="M8 8h12M8 14h12M9 20h4v5H9zM17 20h3M17 25h3" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>学习报告</span>
        </button>
    </div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading...</div>
        <div class="loading-progress" id="loadingProgress">0%</div>
    </div>
    <div class="blur-overlay" id="startOverlay" style="display: none;"></div>
    <button class="start_button" id="startBtn" style="display: none;">开始游戏</button>
    <script src="./game-tracker.js"></script>
    <script src="./play.js"></script>
</body>
</html>
