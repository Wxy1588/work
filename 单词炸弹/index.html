<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>单词炸弹</title>
  <style>
    :root {
      --ink: #182034;
      --paper: rgba(255, 255, 255, 0.9);
      --paper-strong: rgba(255, 255, 255, 0.98);
      --line: rgba(24, 32, 52, 0.18);
      --accent: #f04f45;
      --accent-deep: #bb2e30;
      --mint: #1e9b78;
      --gold: #f6b83f;
      --shadow: 0 18px 45px rgba(20, 26, 43, 0.22);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #e9f0ef;
    }

    #gameRoot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      user-select: none;
      touch-action: manipulation;
    }

    #background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }

    #gameCanvas {
      position: relative;
      z-index: 1;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: block;
      background: transparent;
    }

    #uiLayer {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    #hud {
      position: absolute;
      top: max(22px, env(safe-area-inset-top));
      left: 54%;
      transform: translateX(-8%);
      display: none;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .hud_item {
      min-width: 122px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 10px 22px rgba(22, 30, 50, 0.12);
      color: #182034;
      font-weight: 800;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .scrim {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(220, 224, 228, 0.56);
      backdrop-filter: blur(9px);
      pointer-events: auto;
    }

    .panel {
      width: min(560px, calc(100vw - 34px));
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .panel h1,
    .panel h2 {
      margin: 0 0 14px;
      color: #151d31;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .panel h1 {
      font-size: 34px;
    }

    .panel h2 {
      font-size: 28px;
    }

    .panel p {
      margin: 0 0 18px;
      color: rgba(24, 32, 52, 0.78);
      font-size: 17px;
      line-height: 1.65;
    }

    .field {
      display: grid;
      gap: 10px;
      margin: 16px 0 18px;
    }

    .field label {
      font-size: 15px;
      font-weight: 800;
      color: rgba(24, 32, 52, 0.82);
    }

    .field input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: var(--paper-strong);
      color: var(--ink);
      font-size: 20px;
      font-weight: 800;
    }

    .field input:focus {
      border-color: rgba(240, 79, 69, 0.68);
      box-shadow: 0 0 0 4px rgba(240, 79, 69, 0.16);
    }

    .setup_panel {
      width: min(430px, calc(100vw - 34px));
      padding: 26px 28px 28px;
      text-align: center;
    }

    .setup_panel h2 {
      margin-bottom: 22px;
      font-size: 30px;
    }

    .count_picker {
      display: grid;
      grid-template-columns: 58px 1fr 58px;
      align-items: center;
      gap: 12px;
      margin: 0 auto 22px;
      width: min(320px, 100%);
    }

    .count_button {
      width: 58px;
      height: 58px;
      border: 1px solid rgba(24, 32, 52, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      color: #1d2740;
      cursor: pointer;
      font-family: inherit;
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 10px 20px rgba(24, 32, 52, 0.1);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .count_button:hover {
      transform: translateY(-2px);
      background: #fff;
    }

    .count_button:active {
      transform: translateY(1px);
      box-shadow: 0 7px 14px rgba(24, 32, 52, 0.12);
    }

    .count_input {
      width: 100%;
      height: 72px;
      border: 1px solid rgba(30, 155, 120, 0.28);
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, 0.94);
      color: #182034;
      font-family: inherit;
      font-size: 42px;
      font-weight: 900;
      text-align: center;
      box-shadow: inset 0 0 0 3px rgba(30, 155, 120, 0.08);
    }

    .count_input:focus {
      border-color: rgba(30, 155, 120, 0.65);
      box-shadow: 0 0 0 4px rgba(30, 155, 120, 0.14);
    }

    .count_input::-webkit-outer-spin-button,
    .count_input::-webkit-inner-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    .difficulty_panel {
      position: relative;
      width: min(620px, calc(100vw - 34px));
      overflow: hidden;
      padding: 30px 32px 34px;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(236, 251, 246, 0.96));
    }

    .difficulty_panel::before,
    .difficulty_panel::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      pointer-events: none;
    }

    .difficulty_panel::before {
      top: -100px;
      right: -52px;
      background: rgba(240, 79, 69, 0.12);
    }

    .difficulty_panel::after {
      left: -94px;
      bottom: -102px;
      background: rgba(30, 155, 120, 0.14);
    }

    .difficulty_intro {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      margin: 0 0 10px;
      padding: 0 12px;
      border-radius: 8px;
      background: rgba(30, 155, 120, 0.12);
      color: #176f5d;
      font-size: 14px;
      font-weight: 900;
    }

    .difficulty_panel h2 {
      position: relative;
      margin-bottom: 24px;
      font-size: 36px;
    }

    .difficulty_options {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .difficulty_button {
      position: relative;
      min-height: 178px;
      overflow: hidden;
      padding: 18px 14px 56px;
      border: 2px solid rgba(24, 32, 52, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      color: #182034;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 14px 0 rgba(24, 32, 52, 0.1), 0 20px 34px rgba(24, 32, 52, 0.14);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .difficulty_button::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(30, 155, 120, 0.55);
    }

    .difficulty_icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: rgba(30, 155, 120, 0.14);
      color: #176f5d;
      font-size: 22px;
      font-weight: 900;
    }

    .difficulty_button:hover {
      transform: translateY(-5px);
      background: #fff;
      box-shadow: 0 16px 0 rgba(24, 32, 52, 0.1), 0 26px 38px rgba(24, 32, 52, 0.18);
    }

    .difficulty_button:active {
      transform: translateY(7px);
      box-shadow: 0 5px 0 rgba(24, 32, 52, 0.12), 0 10px 18px rgba(24, 32, 52, 0.14);
    }

    .difficulty_button.easy {
      border-color: rgba(30, 155, 120, 0.24);
      background: linear-gradient(180deg, rgba(239, 255, 250, 0.98), rgba(255, 255, 255, 0.92));
    }

    .difficulty_button.easy .difficulty_icon {
      background: rgba(30, 155, 120, 0.14);
      color: #176f5d;
    }

    .difficulty_button.medium {
      border-color: rgba(246, 184, 63, 0.36);
      background: linear-gradient(180deg, rgba(255, 248, 226, 0.98), rgba(255, 255, 255, 0.92));
    }

    .difficulty_button.medium::before {
      background: rgba(246, 184, 63, 0.75);
    }

    .difficulty_button.medium .difficulty_icon {
      background: rgba(246, 184, 63, 0.18);
      color: #945e05;
    }

    .difficulty_button.hard {
      border-color: rgba(240, 79, 69, 0.26);
      background: linear-gradient(180deg, rgba(255, 238, 236, 0.98), rgba(255, 255, 255, 0.92));
    }

    .difficulty_button.hard::before {
      background: rgba(240, 79, 69, 0.72);
    }

    .difficulty_button.hard .difficulty_icon {
      background: rgba(240, 79, 69, 0.14);
      color: #bb2e30;
    }

    .difficulty_title {
      position: relative;
      display: block;
      margin-bottom: 8px;
      font-size: 26px;
      font-weight: 900;
    }

    .difficulty_action {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: grid;
      place-items: center;
      min-height: 34px;
      border-radius: 8px;
      background: rgba(30, 155, 120, 0.92);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.13);
    }

    .difficulty_button.medium .difficulty_action {
      background: rgba(210, 137, 18, 0.92);
    }

    .difficulty_button.hard .difficulty_action {
      background: rgba(200, 61, 58, 0.94);
    }

    .rules_panel {
      width: min(560px, calc(100vw - 34px));
      padding: 28px 30px 30px;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(235, 250, 246, 0.96));
    }

    .rules_panel h2 {
      margin-bottom: 18px;
      text-align: center;
      font-size: 32px;
    }

    .difficulty_chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      margin: 0 0 16px;
      padding: 0 14px;
      border-radius: 8px;
      background: rgba(246, 184, 63, 0.18);
      color: #945e05;
      font-size: 15px;
      font-weight: 900;
    }

    .rule_steps {
      display: grid;
      gap: 10px;
      margin: 0 0 22px;
    }

    .rule_step {
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(24, 32, 52, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      text-align: left;
      box-shadow: 0 8px 18px rgba(24, 32, 52, 0.07);
    }

    .rule_badge {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(30, 155, 120, 0.16);
      color: #176f5d;
      font-size: 18px;
      font-weight: 900;
    }

    .rule_text {
      color: rgba(24, 32, 52, 0.84);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.45;
    }

    .button_row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .start_button,
    .game_button,
    .player_button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 12px 24px rgba(187, 46, 48, 0.22);
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .start_button {
      min-width: 180px;
      padding: 0 28px;
      background: linear-gradient(180deg, var(--accent), var(--accent-deep));
      color: #fff;
      font-size: 22px;
      border: 2px solid rgba(255, 255, 255, 0.58);
    }

    .game_button {
      padding: 0 22px;
      background: #1f8f73;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(31, 143, 115, 0.22);
    }

    .player_button {
      width: min(188px, 42vw);
      padding: 0 14px;
      background: #fff;
      color: #1d2740;
      font-size: 18px;
      cursor: pointer;
      border: 1px solid rgba(24, 32, 52, 0.12);
      box-shadow: 0 10px 20px rgba(24, 32, 52, 0.12);
    }

    .start_button:hover,
    .game_button:hover,
    .player_button:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .start_button:active,
    .game_button:active,
    .player_button:active {
      transform: translateY(1px);
      box-shadow: 0 7px 15px rgba(24, 32, 52, 0.18);
    }

    .player_grid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      pointer-events: none;
      --lane-top: 15.5%;
      --lane-bottom: 81%;
      --lane-left: 14.5%;
      --lane-right: 85.5%;
    }

    .player_lane {
      position: absolute;
      display: flex;
      gap: 12px;
      pointer-events: none;
    }

    .player_lane.top,
    .player_lane.bottom {
      left: 5%;
      right: 5%;
      gap: 24px;
      justify-content: center;
      align-items: center;
    }

    .player_lane.top {
      top: var(--lane-top);
      transform: translateY(-50%);
    }

    .player_lane.bottom {
      top: var(--lane-bottom);
      bottom: auto;
      transform: translateY(-50%);
    }

    .player_lane.left,
    .player_lane.right {
      top: 130px;
      bottom: 130px;
      width: 274px;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }

    .player_lane.left {
      left: var(--lane-left);
      transform: translateX(-50%);
    }

    .player_lane.right {
      left: var(--lane-right);
      right: auto;
      transform: translateX(-50%);
    }

    .player_card {
      position: relative;
      display: grid;
      grid-template-columns: 46px 61px 38px 42px 42px;
      align-items: center;
      gap: 6px;
      width: 274px;
      min-height: 66px;
      padding: 9px 8px 9px 11px;
      border: 1px solid rgba(24, 32, 52, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: #1d2740;
      box-shadow: 0 10px 20px rgba(24, 32, 52, 0.12);
      pointer-events: auto;
    }

    .player_card.eliminated {
      opacity: 0.58;
      filter: grayscale(1);
      background: rgba(226, 230, 232, 0.92);
      color: rgba(24, 32, 52, 0.52);
    }

    .player_card.current_turn {
      border-color: rgba(246, 184, 63, 0.88);
      box-shadow: 0 0 0 4px rgba(246, 184, 63, 0.22), 0 12px 24px rgba(24, 32, 52, 0.16);
    }

    .player_avatar {
      display: block;
      width: 46px;
      height: 46px;
      padding: 2px;
      border: 1px solid rgba(30, 155, 120, 0.18);
      border-radius: 50%;
      background: rgba(226, 246, 240, 0.72);
      object-fit: contain;
      pointer-events: none;
    }

    .player_name {
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .player_score {
      display: grid;
      place-items: center;
      min-width: 38px;
      min-height: 38px;
      border-radius: 8px;
      background: rgba(30, 155, 120, 0.12);
      color: #176f5d;
      font-size: 24px;
      font-weight: 900;
    }

    .judge_button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(24, 32, 52, 0.14);
      transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
    }

    .judge_button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .judge_button:active {
      transform: translateY(1px);
      box-shadow: 0 5px 11px rgba(24, 32, 52, 0.14);
    }

    .judge_button:disabled {
      cursor: default;
      opacity: 0.45;
      transform: none;
      box-shadow: none;
    }

    .judge_yes {
      background: #1f8f73;
    }

    .judge_no {
      background: #c83d3a;
    }

    .toast {
      min-height: 24px;
      margin-top: 12px;
      color: var(--accent-deep);
      font-size: 15px;
      font-weight: 800;
      text-align: center;
    }

    .winner_panel {
      position: relative;
      width: min(1040px, calc(100vw - 34px));
      overflow: hidden;
      padding: 28px 30px 30px;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(255, 248, 229, 0.98), rgba(255, 255, 255, 0.96) 52%, rgba(219, 246, 239, 0.96));
    }

    .winner_panel::before,
    .winner_panel::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      pointer-events: none;
    }

    .winner_panel::before {
      top: -92px;
      right: -60px;
      background: rgba(246, 184, 63, 0.22);
    }

    .winner_panel::after {
      left: -86px;
      bottom: -98px;
      background: rgba(30, 155, 120, 0.18);
    }

    .winner_home_button {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 3;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(24, 32, 52, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      color: #1d2740;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 9px 18px rgba(24, 32, 52, 0.1);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .winner_home_button:hover {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 12px 22px rgba(24, 32, 52, 0.14);
    }

    .winner_home_button:active {
      transform: translateY(1px);
      box-shadow: 0 6px 12px rgba(24, 32, 52, 0.12);
    }

    .winner_mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 82px;
      height: 82px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffd86b, #f6a932);
      color: #8a5200;
      font-size: 42px;
      font-weight: 900;
      box-shadow: 0 16px 30px rgba(181, 111, 5, 0.2);
    }

    .winner_title {
      position: relative;
      margin: 0;
      color: #172039;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
    }

    .winner_subtitle {
      position: relative;
      margin: 10px 0 18px;
      color: rgba(24, 32, 52, 0.72);
      font-size: 16px;
      font-weight: 800;
    }

    .winner_champion {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 230px;
      min-height: 78px;
      margin: 0 0 20px;
      padding: 0 28px;
      border: 2px solid rgba(246, 184, 63, 0.72);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      color: #9a5e00;
      font-size: 38px;
      font-weight: 900;
      box-shadow: 0 14px 28px rgba(154, 94, 0, 0.14);
    }

    .winner_theme {
      position: relative;
      width: min(360px, 100%);
      margin: 0 auto 22px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(30, 155, 120, 0.12);
      color: #176f5d;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.45;
    }

    .winner_panel .button_row {
      position: relative;
    }

    .winner_layout {
      position: relative;
      display: grid;
      grid-template-columns: minmax(210px, 260px) minmax(0, 1fr) 230px;
      gap: 22px;
      align-items: center;
    }

    .winner_avatar {
      position: relative;
      display: block;
      width: 100%;
      height: 320px;
      object-fit: contain;
      filter: drop-shadow(0 18px 22px rgba(154, 94, 0, 0.18));
      pointer-events: none;
    }

    .winner_avatar_group {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .loser_avatar_row {
      --loser-avatar-size: 58px;
      --loser-tear-width: 5px;
      --loser-tear-height: 10px;
      --tear-distance: 20px;
      display: flex;
      width: 100%;
      min-height: calc(var(--loser-avatar-size) + 18px);
      align-items: flex-start;
      justify-content: center;
      gap: 6px;
    }

    .loser_avatar_row.avatar_count_1 {
      --loser-avatar-size: 81px;
      --loser-tear-width: 7px;
      --loser-tear-height: 14px;
      --tear-distance: 28px;
    }

    .loser_avatar_row.avatar_count_2 {
      --loser-avatar-size: 73px;
      --loser-tear-width: 6px;
      --loser-tear-height: 13px;
      --tear-distance: 25px;
    }

    .loser_avatar_row.avatar_count_3 {
      --loser-avatar-size: 65px;
      --loser-tear-width: 6px;
      --loser-tear-height: 11px;
      --tear-distance: 22px;
    }

    .loser_avatar_item {
      display: flex;
      width: var(--loser-avatar-size);
      flex: 0 0 var(--loser-avatar-size);
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .loser_avatar_visual {
      position: relative;
      width: var(--loser-avatar-size);
      height: var(--loser-avatar-size);
      flex: 0 0 var(--loser-avatar-size);
    }

    .loser_avatar {
      display: block;
      width: var(--loser-avatar-size);
      height: var(--loser-avatar-size);
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(24, 32, 52, 0.14));
      pointer-events: none;
    }

    .loser_tear {
      position: absolute;
      z-index: 1;
      width: var(--loser-tear-width);
      height: var(--loser-tear-height);
      border-radius: 50% 50% 55% 55%;
      background: linear-gradient(180deg, rgba(160, 235, 255, 0.95), rgba(60, 170, 235, 0.72));
      box-shadow: 0 2px 4px rgba(58, 155, 220, 0.28);
      opacity: 0;
      pointer-events: none;
      animation: loserTearDrop 1150ms ease-in infinite;
    }

    .loser_tear.left {
      animation-delay: 80ms;
    }

    .loser_tear.right {
      animation-delay: 430ms;
    }

    .loser_avatar_name {
      width: 100%;
      overflow: hidden;
      color: rgba(24, 32, 52, 0.76);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .winner_summary {
      min-width: 0;
    }

    .rank_panel {
      position: relative;
      padding: 16px;
      border: 1px solid rgba(24, 32, 52, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 24px rgba(24, 32, 52, 0.1);
    }

    .rank_title {
      margin: 0 0 10px;
      color: #172039;
      font-size: 20px;
      font-weight: 900;
    }

    .rank_item {
      display: grid;
      grid-template-columns: 32px 34px 1fr 38px;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      border-top: 1px solid rgba(24, 32, 52, 0.08);
      color: rgba(24, 32, 52, 0.82);
      font-weight: 900;
    }

    .rank_item:first-of-type {
      border-top: 0;
    }

    .rank_place {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(246, 184, 63, 0.2);
      color: #945e05;
      font-size: 14px;
    }

    .rank_avatar {
      display: block;
      width: 34px;
      height: 34px;
      padding: 1px;
      border: 1px solid rgba(30, 155, 120, 0.14);
      border-radius: 50%;
      background: rgba(226, 246, 240, 0.62);
      object-fit: contain;
      pointer-events: none;
    }

    .rank_name {
      text-align: left;
      white-space: nowrap;
    }

    .rank_score {
      text-align: right;
      color: #176f5d;
      font-size: 20px;
    }

    @keyframes loserTearDrop {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.72);
      }

      18% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(var(--tear-distance)) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loser_tear {
        opacity: 0.72;
        transform: translateY(4px) scale(0.85);
        animation: none;
      }
    }

    @media (max-width: 900px) {
      .winner_layout {
        grid-template-columns: 190px minmax(0, 1fr);
      }

      .winner_avatar {
        height: 230px;
      }

      .loser_avatar_row {
        --loser-avatar-size: 40px;
        --loser-tear-width: 4px;
        --loser-tear-height: 8px;
        --tear-distance: 14px;
        gap: 4px;
      }

      .loser_avatar_row.avatar_count_1 {
        --loser-avatar-size: 56px;
        --loser-tear-width: 6px;
        --loser-tear-height: 11px;
        --tear-distance: 20px;
      }

      .loser_avatar_row.avatar_count_2 {
        --loser-avatar-size: 50px;
        --loser-tear-width: 5px;
        --loser-tear-height: 10px;
        --tear-distance: 18px;
      }

      .loser_avatar_row.avatar_count_3 {
        --loser-avatar-size: 45px;
        --loser-tear-width: 5px;
        --loser-tear-height: 9px;
        --tear-distance: 16px;
      }

      .loser_avatar_name {
        font-size: 10px;
      }

      .rank_panel {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 680px) {
      #hud {
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        width: min(94vw, 430px);
        transform: translateX(-50%);
        justify-content: center;
        gap: 8px;
      }

      .hud_item {
        min-width: 96px;
        padding: 8px 10px;
        font-size: 14px;
      }

      .panel {
        padding: 22px;
      }

      .panel h1 {
        font-size: 28px;
      }

      .panel h2 {
        font-size: 24px;
      }

      .panel p {
        font-size: 15px;
      }

      .setup_panel {
        padding: 22px;
      }

      .count_picker {
        grid-template-columns: 52px 1fr 52px;
        gap: 10px;
      }

      .count_button {
        width: 52px;
        height: 52px;
      }

      .count_input {
        height: 64px;
        font-size: 38px;
      }

      .difficulty_panel {
        padding: 24px 20px 26px;
      }

      .difficulty_panel h2 {
        font-size: 30px;
      }

      .difficulty_options {
        grid-template-columns: 1fr;
      }

      .difficulty_button {
        min-height: 112px;
        display: grid;
        grid-template-columns: 48px 1fr;
        column-gap: 12px;
        align-items: center;
        text-align: left;
        padding: 16px 14px 16px;
      }

      .difficulty_icon {
        margin: 0;
      }

      .difficulty_title {
        margin-bottom: 2px;
        font-size: 24px;
      }

      .difficulty_action {
        position: static;
        grid-column: 2;
        min-height: 30px;
        margin-top: 8px;
      }

      .rules_panel {
        padding: 24px 20px 26px;
      }

      .rules_panel h2 {
        font-size: 28px;
      }

      .rule_step {
        grid-template-columns: 34px 1fr;
        gap: 10px;
        padding: 11px 12px;
      }

      .rule_badge {
        width: 34px;
        height: 34px;
        font-size: 16px;
      }

      .rule_text {
        font-size: 15px;
      }

      .winner_panel {
        padding: 24px 20px 26px;
      }

      .winner_home_button {
        top: 10px;
        right: 10px;
        min-height: 36px;
        padding: 0 10px;
        font-size: 13px;
      }

      .winner_layout {
        grid-template-columns: 1fr;
      }

      .winner_avatar {
        width: min(190px, 70vw);
        height: 190px;
        margin: 0 auto;
      }

      .winner_mark {
        width: 72px;
        height: 72px;
        font-size: 36px;
      }

      .winner_title {
        font-size: 29px;
      }

      .winner_champion {
        min-width: 200px;
        min-height: 68px;
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main id="gameRoot" aria-label="单词炸弹游戏">
    <img id="background" src="background.svg" alt="">
    <audio id="backgroundMusic" src="background.mp3" preload="auto" loop autoplay playsinline></audio>
    <canvas id="gameCanvas" width="1600" height="900"></canvas>
    <section id="uiLayer" aria-live="polite">
      <div id="hud">
        <div class="hud_item" id="timerHud">计时 --</div>
        <div class="hud_item" id="scoreHud">得分 0</div>
      </div>
      <div id="playerGrid" class="player_grid"></div>
    </section>
  </main>
  <script src="themes.js"></script>
  <script src="play.js"></script>
</body>
</html>
