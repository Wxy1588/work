<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Runner Game</title>
    <style>
        :root {
            --report-shortcut-start: #78cfea;
            --report-shortcut-end: #83e7bd;
            --report-shortcut-text: #235c63;
            --report-shortcut-border: #1f626a;
            --hud-info-start: rgba(229, 249, 245, 0.9);
            --hud-info-end: rgba(202, 240, 230, 0.9);
            --hud-info-text: #244b50;
            --report-action-start: #63c783;
            --report-action-end: #389d61;
            --report-action-border: #1f7048;
            --report-panel-scale: 1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87CEEB;
        }
        #gameContainer {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .speed-control {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-radius: 30px;
            padding: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }
        .speed-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .speed-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }
        .speed-btn:active {
            transform: scale(0.95);
        }
        .speed-value {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin: 0 15px;
            min-width: 40px;
            text-align: center;
        }
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .top-hud {
            position: absolute;
            top: clamp(8px, 0.75vw, 12px);
            right: clamp(8px, 1.25vw, 20px);
            left: auto;
            transform: none;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: clamp(8px, 1.4vw, 22px);
            z-index: 20;
            white-space: nowrap;
        }
        .report-shortcut-btn,
        .hud-info-bar {
            height: clamp(34px, 3vw, 48px);
            border: 2px solid var(--report-shortcut-border);
            border-radius: clamp(9px, 0.8vw, 12px);
            box-shadow: none;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }
        .report-shortcut-btn {
            position: relative;
            flex: 0 0 auto;
            min-width: clamp(68px, 7.5vw, 110px);
            padding: 0 clamp(10px, 1vw, 16px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: clamp(5px, 0.5vw, 8px);
            color: var(--report-shortcut-text);
            background: linear-gradient(145deg, var(--report-shortcut-start), var(--report-shortcut-end));
            font-size: clamp(12px, 1vw, 16px);
            font-weight: 800;
            letter-spacing: 0.08em;
            line-height: 1;
            white-space: nowrap;
            cursor: pointer;
            transition: transform 160ms ease, filter 160ms ease;
            -webkit-tap-highlight-color: transparent;
        }
        .report-shortcut-btn::before {
            content: "";
            width: clamp(12px, 1.2vw, 16px);
            height: clamp(14px, 1.4vw, 19px);
            flex: 0 0 auto;
            border: 2px solid currentColor;
            border-radius: 3px;
            background:
                linear-gradient(currentColor, currentColor) 3px 4px / calc(100% - 6px) 2px no-repeat,
                linear-gradient(currentColor, currentColor) 3px 8px / calc(100% - 6px) 2px no-repeat,
                linear-gradient(currentColor, currentColor) 3px 12px / 55% 2px no-repeat;
            opacity: 0.88;
            box-sizing: border-box;
        }
        .report-shortcut-btn:hover {
            transform: translateY(-2px);
            box-shadow: none;
            filter: brightness(1.03);
        }
        .report-shortcut-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        .report-shortcut-btn:focus-visible {
            outline: 3px solid rgba(47, 102, 91, 0.42);
            outline-offset: 3px;
        }
        .hud-info-bar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--hud-info-text);
            background: linear-gradient(145deg, var(--hud-info-start), var(--hud-info-end));
            font-size: clamp(12px, 1.35vw, 21px);
            font-weight: 800;
            line-height: 1;
        }
        .status-info-bar {
            gap: clamp(8px, 1vw, 16px);
            padding: 0 clamp(12px, 1.5vw, 24px);
        }
        .status-divider {
            width: 2px;
            height: 52%;
            flex: 0 0 auto;
            border-radius: 2px;
            background: rgba(31, 98, 106, 0.34);
        }
        .lives-info-bar {
            gap: clamp(3px, 0.45vw, 7px);
            padding: 0 clamp(8px, 1vw, 16px);
        }
        .hud-heart {
            width: clamp(19px, 2vw, 32px);
            height: clamp(19px, 2vw, 32px);
            object-fit: contain;
            transition: filter 180ms ease, opacity 180ms ease;
        }
        .hud-heart.lost {
            filter: grayscale(1) brightness(0.78);
            opacity: 0.48;
        }
        @media (prefers-reduced-motion: reduce) {
            .report-shortcut-btn,
            .hud-heart {
                transition: none;
            }
        }
        @media (max-width: 420px) {
            .top-hud {
                gap: 4px;
            }
            .report-shortcut-btn {
                min-width: 60px;
                padding: 0 7px;
                gap: 4px;
                font-size: 11px;
            }
            .status-info-bar {
                gap: 5px;
                padding: 0 7px;
            }
            .lives-info-bar {
                gap: 1px;
                padding: 0 5px;
            }
        }
        .start_button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 60px;
            font-size: 32px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .start_button:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 50;
        }
        .result-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .celebration-bg {
            width: 500px;
            height: 350px;
            background-image: url('assets/image/jiesuan.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .result-panel p {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            color: #ff6b6b;
            margin: 0;
            position: absolute;
            top: 45px;
        }
        .hidden {
            display: none !important;
        }
        /* 成绩报告面板样式 */
        .report-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(var(--report-panel-scale));
            transform-origin: center;
            width: 650px;
            height: 420px;
            background-image: url('assets/image/report.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 100;
            padding: 60px 60px 70px 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
        }
        .report-content {
            flex: 1;
            overflow: hidden;
            margin-top: 10px;
        }
        .report-section {
            margin-bottom: 15px;
            padding-right: 5px;
        }
        /* 未掌握单词区域 */
        .report-item.incorrect {
            font-size: 20px;
            color: #34495e;
            padding: 10px 20px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .report-item.incorrect .label {
            font-weight: bold;
            color: #e74c3c;
            white-space: nowrap;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .report-item.incorrect .words {
            flex: 1;
            word-break: keep-all;
            white-space: pre-wrap;
            color: #e74c3c;
        }
        /* 已掌握单词区域 */
        .report-item.correct {
            font-size: 20px;
            color: #34495e;
            padding: 10px 20px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .report-item.correct .label {
            font-weight: bold;
            color: #27ae60;
            white-space: nowrap;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .report-item.correct .words {
            flex: 1;
            word-break: keep-all;
            white-space: pre-wrap;
            color: #27ae60;
            max-height: 180px;
            overflow-y: auto;
            border: 0px solid red;
            padding: 0px;
            box-sizing: border-box;
        }
        .report-progress {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            padding: 0 60px;
            box-sizing: border-box;
        }
        /* 退出按钮样式 */
        .report-actions {
            position: absolute;
            bottom: -58px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: max-content;
        }
        .report-action-btn {
            width: 128px;
            height: 48px;
            border: 2px solid var(--report-action-border);
            border-radius: 8px;
            background: linear-gradient(145deg, var(--report-action-start), var(--report-action-end));
            color: #ffffff;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: none;
            transition: transform 160ms ease, filter 160ms ease;
            -webkit-tap-highlight-color: transparent;
        }
        .report-action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .report-action-btn:active {
            transform: translateY(1px);
        }
        .report-action-btn:focus-visible {
            outline: 3px solid rgba(50, 126, 82, 0.38);
            outline-offset: 3px;
        }
        .report-narration-status {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        /* 加载界面样式 */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }
        .loading-logo {
            margin-bottom: 30px;
        }
        .loading-sheep {
            width: 120px;
            height: 120px;
            background-image: url('assets/image/sheep.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            animation: bounce 1s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        .loading-text {
            font-size: 32px;
            color: white;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        .loading-bar {
            width: 300px;
            height: 15px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        .loading-percent {
            font-size: 18px;
            color: white;
            font-weight: bold;
        }
        
        /* 年级选择样式 */
        .grade-selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 200;
            max-width: 800px;
            width: 90%;
        }
        .grade-selector h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: bold;
        }
        .grade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .grade-btn {
            padding: 15px 20px;
            border: 3px solid #667eea;
            border-radius: 12px;
            background: white;
            color: #667eea;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .grade-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .grade-btn.selected {
            background: #667eea;
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .grade-confirm-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .grade-confirm-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        
        /* 返回按钮样式 */
        .grade-back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #f0f0f0;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        .grade-back-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- 加载界面 -->
        <div id="loadingScreen" class="loading-screen">
            <div class="loading-logo">
                <div class="loading-sheep"></div>
            </div>
            <div class="loading-text">Loading...</div>
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
            <div class="loading-percent" id="loadingPercent">0%</div>
        </div>
        
        <!-- 年级选择界面 -->
        <div id="gradeSelector" class="grade-selector hidden">
            <h2 id="gradeTitle">选择年级</h2>
            <div class="grade-grid" id="gradeGrid">
                <!-- 年级按钮将动态生成 -->
            </div>
        </div>
        
        <canvas id="gameCanvas" width="1600" height="900"></canvas>
        <div id="topHud" class="top-hud hidden">
            <button id="reportShortcutBtn" class="report-shortcut-btn" type="button" title="查看学习报告" aria-label="查看学习报告">学习报告</button>
            <div id="statusInfoBar" class="hud-info-bar status-info-bar" aria-label="关卡与分数">
                <span id="levelInfo">Level: 1/28</span>
                <span class="status-divider" aria-hidden="true"></span>
                <span id="scoreInfo">Score: 0</span>
            </div>
            <div id="livesInfoBar" class="hud-info-bar lives-info-bar" aria-label="剩余 5 次机会">
                <img class="hud-heart" src="assets/image/aixin.png" alt="">
                <img class="hud-heart" src="assets/image/aixin.png" alt="">
                <img class="hud-heart" src="assets/image/aixin.png" alt="">
                <img class="hud-heart" src="assets/image/aixin.png" alt="">
                <img class="hud-heart" src="assets/image/aixin.png" alt="">
            </div>
        </div>
        <div id="overlay" class="overlay"></div>
        
        <!-- 速度控制按钮 -->
        <div id="speedControl" class="speed-control hidden">
            <button class="speed-btn speed-decrease" title="减速">‹</button>
            <span class="speed-value">0.8</span>
            <button class="speed-btn speed-increase" title="加速">›</button>
        </div>
        
        <button id="startBtn" class="start_button">开始游戏</button>
        <div id="resultPanel" class="result-panel hidden">
            <div class="celebration-bg">
                <p id="resultScore"></p>
            </div>
        </div>
        <div id="reportPanel" class="report-panel hidden">
            <div class="report-content" id="reportContent">
                <!-- 成绩报告内容将动态生成 -->
            </div>
            <div id="reportActions" class="report-actions">
                <button id="continueChallengeBtn" class="report-action-btn" type="button">继续挑战</button>
                <button id="playAgainBtn" class="report-action-btn" type="button">再玩一次</button>
            </div>
            <span id="reportNarrationStatus" class="report-narration-status" role="status" aria-live="polite"></span>
        </div>
    </div>
    <script src="game-tracker.js"></script>
    <script src="words.js"></script>
    <script src="play.js?v=20260810-report-background-music"></script>
</body>
</html>
