<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>&#27668;&#27873;&#23383;&#27597;&#37197;&#23545;</title>
  <style>
    :root {
      --duel-ink: #263743;
      --duel-pink: #ff6f9f;
      --duel-blue: #53c8d7;
      --duel-surface: rgba(255, 255, 255, 0.82);
      --duel-shadow: rgba(50, 86, 101, 0.18);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef8ec url("background.svg") center / cover no-repeat;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    #gameRoot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef8ec url("background.svg") center / cover no-repeat;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 56.25vw;
      max-width: 100vw;
      max-height: 100vh;
      background: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (max-aspect-ratio: 16 / 9) {
      #gameCanvas {
        width: 177.7778vh;
        height: 100vh;
      }
    }

    #startLayer {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: rgba(236, 236, 236, 0.48);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 5;
      text-align: center;
    }

    #startLayer.grade_layer {
      justify-content: center;
      padding-top: 0;
      box-sizing: border-box;
      gap: 24px;
    }

    #startLayer.result_layer {
      gap: 22px;
    }

    #startLayer.final_result_layer {
      display: block;
      padding: 0;
      box-sizing: border-box;
    }

    #startLayer.final_result_layer #startPrompt {
      position: absolute;
      top: 62px;
      left: 50%;
      width: 1000px;
      margin-left: -500px;
      max-width: none;
      padding: 0 18px;
      box-sizing: border-box;
      font-size: 52px;
      line-height: 1.2;
    }

    .home_button {
      position: absolute;
      top: 28px;
      right: 34px;
      z-index: 4;
      min-width: 128px;
      height: 48px;
      padding: 0 22px;
      border: 3px solid rgba(255, 255, 255, 0.86);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.72);
      color: #6f3159;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 6px 14px rgba(105, 65, 96, 0.12);
      cursor: pointer;
      outline: none;
      transition: transform 120ms ease, background 120ms ease;
    }

    .home_button:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-1px);
    }

    .home_button:active {
      transform: translateY(2px);
    }

    #startLayer.duel_layer {
      gap: 24px;
    }

    #startLayer.hidden {
      display: none;
    }

    #startPrompt {
      position: relative;
      z-index: 2;
      max-width: 820px;
      padding: 0 28px;
      color: #6f3159;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.28;
      white-space: pre-line;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.72);
    }

    #startPrompt.result_title {
      max-width: 1040px;
      font-size: 58px;
      animation: resultPop 520ms ease both;
    }

    #startPrompt.celebrate_title {
      color: #7b285f;
      animation: celebratePop 700ms cubic-bezier(0.2, 1.4, 0.3, 1) both;
    }

    #startPrompt.grade_title {
      color: #263743;
      font-size: 40px;
      text-shadow: none;
    }

    .grade_grid {
      display: grid;
      grid-template-columns: repeat(4, 204px);
      gap: 18px 24px;
      justify-content: center;
      align-items: center;
      max-width: 920px;
    }

    .book_grid {
      display: grid;
      grid-template-columns: repeat(2, 188px);
      gap: 26px;
      justify-content: center;
      align-items: center;
    }

    .grade_button {
      height: 68px;
      border: 4px solid rgba(255, 255, 255, 0.95);
      border-radius: 17px;
      color: #263743;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 6px 0 rgba(91, 126, 142, 0.45), 0 12px 20px rgba(50, 86, 101, 0.18);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }

    .grade_button:hover {
      filter: brightness(1.04);
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(91, 126, 142, 0.45), 0 16px 24px rgba(50, 86, 101, 0.2);
    }

    .grade_button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(91, 126, 142, 0.45), 0 7px 12px rgba(50, 86, 101, 0.16);
    }

    .grade_button.mint {
      background: linear-gradient(180deg, #ffffff 0%, #e8f8ef 100%);
    }

    .grade_button.gold {
      background: linear-gradient(180deg, #fff4c8 0%, #ffd976 100%);
    }

    .grade_button.blue {
      background: linear-gradient(180deg, #d6f2ff 0%, #78cdeb 100%);
    }

    .grade_button.purple {
      background: linear-gradient(135deg, #6c7be8 0%, #7955b4 100%);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 6px 0 rgba(68, 53, 118, 0.4), 0 12px 20px rgba(42, 37, 90, 0.22);
    }

    .duel_mode_panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .duel_mode_card {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) 76px minmax(150px, 1fr);
      align-items: center;
      width: min(560px, calc(100vw - 40px));
      padding: 24px 28px;
      border: 5px solid rgba(255, 255, 255, 0.96);
      border-radius: 32px;
      background: var(--duel-surface);
      box-shadow: 0 9px 0 rgba(91, 126, 142, 0.32), 0 20px 34px var(--duel-shadow);
      box-sizing: border-box;
    }

    .duel_player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--duel-ink);
      font-weight: 800;
    }

    .duel_player_number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border: 5px solid #ffffff;
      border-radius: 50%;
      color: #ffffff;
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 7px 0 rgba(91, 126, 142, 0.28), 0 12px 22px rgba(50, 86, 101, 0.16);
      box-sizing: border-box;
    }

    .duel_player_1 .duel_player_number {
      background: linear-gradient(180deg, #ff8bb2 0%, var(--duel-pink) 100%);
    }

    .duel_player_2 .duel_player_number {
      background: linear-gradient(180deg, #75d9e5 0%, var(--duel-blue) 100%);
    }

    .duel_player_label {
      font-size: 24px;
    }

    .duel_versus {
      color: #7b5970;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 2px 0 #ffffff;
    }

    .player_name_panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .player_name_input {
      width: 330px;
      height: 74px;
      border: 5px solid rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.84);
      color: #263743;
      font-size: 34px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 8px 0 rgba(91, 126, 142, 0.36), 0 18px 28px rgba(50, 86, 101, 0.16);
      outline: none;
      box-sizing: border-box;
    }

    .player_name_input::placeholder {
      color: rgba(38, 55, 67, 0.42);
    }

    .player_name_input.invalid {
      border-color: #f05a8c;
      box-shadow: 0 8px 0 rgba(154, 49, 93, 0.36), 0 18px 28px rgba(50, 86, 101, 0.16);
    }

    .player_name_hint {
      min-height: 26px;
      color: #9a315d;
      font-size: 22px;
      font-weight: 800;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.68);
    }

    .ready_prefix {
      display: block;
      margin-bottom: 10px;
    }

    .player_ready_title {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .player_ready_avatar {
      width: 70px;
      height: 70px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .result_board {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      min-height: 76px;
      max-width: 900px;
      opacity: 0;
      transform: translateY(22px);
      animation: boardIn 620ms ease forwards;
    }

    .result_badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 190px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      border: 3px solid rgba(255, 255, 255, 0.9);
      color: #6f3159;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 10px 22px rgba(105, 65, 96, 0.14);
    }

    .result_avatar {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .result_badge.win {
      background: #ffe56b;
      color: #6b315c;
      transform: scale(1.06);
      animation: badgePulse 900ms ease infinite alternate;
    }

    .result_confetti {
      position: absolute;
      z-index: 1;
      width: 18px;
      height: 10px;
      border-radius: 5px;
      opacity: 0;
      animation: confettiDrop 1800ms ease-in-out infinite;
      pointer-events: none;
    }

    .celebration_panel {
      position: absolute;
      top: 170px;
      bottom: 24px;
      left: 50%;
      width: 720px;
      margin-left: -360px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      pointer-events: none;
    }

    .celebration_winners_row,
    .celebration_losers_row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .celebration_winners_row {
      min-height: 220px;
      gap: 22px;
    }

    .celebration_losers_row {
      min-height: 122px;
      margin-top: 36px;
      gap: 18px;
    }

    .celebration_panel .start_button {
      flex: 0 0 auto;
      min-width: 250px;
      min-height: 78px;
      font-size: 30px;
      pointer-events: auto;
    }

    .celebration_avatar_wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 18px 24px rgba(85, 70, 102, 0.18));
      animation: avatarFloat 1500ms ease-in-out infinite alternate;
    }

    .celebration_avatar {
      display: block;
      object-fit: contain;
    }

    .celebration_avatar_happy {
      width: 210px;
      height: 210px;
    }

    .celebration_winners_row.avatar_count_1 .celebration_avatar_happy {
      width: 260px;
      height: 260px;
    }

    .celebration_winners_row.avatar_count_2 .celebration_avatar_happy {
      width: 230px;
      height: 230px;
    }

    .celebration_avatar_sad {
      width: 112px;
      height: 112px;
      opacity: 0.96;
    }

    .celebration_player_name {
      position: absolute;
      top: calc(100% + 4px);
      left: 50%;
      max-width: 150px;
      transform: translateX(-50%);
      overflow: hidden;
      color: #74305f;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .celebration_winners_row.avatar_count_3 .celebration_avatar_happy {
      width: 180px;
      height: 180px;
    }

    .celebration_winners_row.avatar_count_4 .celebration_avatar_happy {
      width: 160px;
      height: 160px;
    }

    .celebration_winners_row.avatar_count_5 .celebration_avatar_happy {
      width: 135px;
      height: 135px;
    }

    .leaderboard {
      position: absolute;
      z-index: 3;
      top: 146px;
      right: 34px;
      width: 360px;
      padding: 18px;
      box-sizing: border-box;
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 16px 34px rgba(105, 65, 96, 0.16);
      opacity: 0;
      transform: translateX(28px);
      animation: leaderboardIn 620ms ease forwards;
    }

    .leaderboard_title {
      margin-bottom: 14px;
      color: #6f3159;
      font-size: 34px;
      font-weight: 900;
    }

    .leaderboard_list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .leaderboard_row {
      display: flex;
      align-items: center;
      min-height: 70px;
      padding: 7px 14px 7px 9px;
      box-sizing: border-box;
      border: 3px solid rgba(255, 255, 255, 0.88);
      border-radius: 20px;
      background: rgba(246, 247, 251, 0.82);
      color: #6f3159;
      text-align: left;
    }

    .leaderboard_row.win {
      background: #ffe56b;
      border-color: #fff4b6;
      box-shadow: 0 7px 16px rgba(151, 112, 37, 0.15);
    }

    .leaderboard_rank {
      display: inline-flex;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      color: #7b285f;
      font-size: 20px;
      font-weight: 900;
      flex: 0 0 auto;
      margin-right: 8px;
    }

    .leaderboard_avatar {
      width: 52px;
      height: 52px;
      object-fit: contain;
      flex: 0 0 auto;
      margin-right: 8px;
    }

    .leaderboard_details {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 2px;
    }

    .leaderboard_name,
    .leaderboard_time {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 900;
    }

    .leaderboard_name {
      font-size: 21px;
    }

    .leaderboard_time {
      color: #8a5272;
      font-size: 18px;
    }

    .mistake_board {
      position: absolute;
      z-index: 3;
      top: 146px;
      left: 34px;
      width: 360px;
      padding: 18px;
      box-sizing: border-box;
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 16px 34px rgba(105, 65, 96, 0.16);
      opacity: 0;
      transform: translateX(-28px);
      animation: mistakeBoardIn 620ms ease forwards;
    }

    .mistake_board_title {
      margin-bottom: 14px;
      color: #6f3159;
      font-size: 34px;
      font-weight: 900;
    }

    .mistake_list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mistake_row {
      display: flex;
      align-items: center;
      min-height: 70px;
      padding: 9px 12px 9px 14px;
      box-sizing: border-box;
      border: 3px solid rgba(255, 255, 255, 0.88);
      border-radius: 20px;
      background: rgba(246, 247, 251, 0.82);
      color: #6f3159;
      text-align: left;
    }

    .mistake_text {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 10px;
      line-height: 1.25;
    }

    .mistake_word {
      font-size: 20px;
      font-weight: 900;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .mistake_meaning {
      font-size: 18px;
      font-weight: 800;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .mistake_empty {
      padding: 26px 10px;
      color: #8a5272;
      font-size: 20px;
      font-weight: 800;
    }

    .tear {
      position: absolute;
      width: 10px;
      height: 19px;
      border-radius: 50% 50% 55% 55%;
      background: linear-gradient(180deg, rgba(160, 235, 255, 0.95), rgba(60, 170, 235, 0.72));
      box-shadow: 0 3px 8px rgba(58, 155, 220, 0.28);
      opacity: 0;
      animation: tearDrop 1150ms ease-in infinite;
    }

    .tear.left {
      animation-delay: 80ms;
    }

    .tear.right {
      animation-delay: 430ms;
    }

    .start_button {
      position: relative;
      z-index: 2;
      min-width: 260px;
      min-height: 88px;
      padding: 0 42px;
      border: 5px solid #ffffff;
      border-radius: 44px;
      background: linear-gradient(180deg, #ff7fa8 0%, #f04f86 100%);
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 12px 0 #ba3a65, 0 20px 34px rgba(122, 43, 83, 0.24);
      outline: none;
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }

    .start_button:hover {
      filter: brightness(1.05);
      transform: translateY(-3px);
      box-shadow: 0 15px 0 #ba3a65, 0 24px 38px rgba(122, 43, 83, 0.28);
    }

    .start_button:active {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #ba3a65, 0 10px 18px rgba(122, 43, 83, 0.2);
    }

    @keyframes resultPop {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes boardIn {
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes leaderboardIn {
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes mistakeBoardIn {
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 1400px), (max-height: 700px) {
      #startLayer.final_result_layer #startPrompt {
        top: 44px;
        width: 760px;
        margin-left: -380px;
        font-size: 38px;
      }

      .celebration_panel {
        top: 120px;
        bottom: 18px;
        width: 500px;
        margin-left: -250px;
      }

      .celebration_winners_row {
        min-height: 174px;
        gap: 10px;
      }

      .celebration_avatar_happy {
        width: 164px;
        height: 164px;
      }

      .celebration_winners_row.avatar_count_1 .celebration_avatar_happy {
        width: 190px;
        height: 190px;
      }

      .celebration_winners_row.avatar_count_2 .celebration_avatar_happy {
        width: 175px;
        height: 175px;
      }

      .celebration_winners_row.avatar_count_4 .celebration_avatar_happy {
        width: 105px;
        height: 105px;
      }

      .celebration_winners_row.avatar_count_3 .celebration_avatar_happy {
        width: 130px;
        height: 130px;
      }

      .celebration_winners_row.avatar_count_5 .celebration_avatar_happy {
        width: 85px;
        height: 85px;
      }

      .celebration_panel .start_button {
        min-width: 220px;
        min-height: 66px;
        font-size: 27px;
      }

      .celebration_losers_row {
        min-height: 94px;
        margin-top: 24px;
        gap: 10px;
      }

      .celebration_avatar_sad {
        width: 86px;
        height: 86px;
      }

      .celebration_player_name {
        max-width: 110px;
        font-size: 16px;
      }

      .leaderboard {
        top: 112px;
        right: 20px;
        width: 300px;
        padding: 14px;
      }

      .mistake_board {
        top: 112px;
        left: 20px;
        width: 300px;
        padding: 14px;
      }

      .mistake_board_title {
        margin-bottom: 12px;
        font-size: 28px;
      }

      .mistake_list {
        gap: 7px;
      }

      .mistake_row {
        min-height: 62px;
        padding: 7px 8px 7px 10px;
      }

      .mistake_word {
        font-size: 17px;
      }

      .mistake_meaning {
        font-size: 16px;
      }

      .leaderboard_title {
        margin-bottom: 12px;
        font-size: 28px;
      }

      .leaderboard_list {
        gap: 7px;
      }

      .leaderboard_row {
        min-height: 62px;
        padding: 4px 8px 4px 6px;
      }

      .leaderboard_rank {
        width: 27px;
        height: 27px;
        font-size: 17px;
        margin-right: 6px;
      }

      .leaderboard_avatar {
        width: 40px;
        height: 40px;
        margin-right: 6px;
      }

      .leaderboard_name {
        font-size: 17px;
      }

      .leaderboard_time {
        font-size: 15px;
      }
    }

    @media (max-width: 1100px) {
      .celebration_panel {
        width: 440px;
        margin-left: -220px;
      }

      .leaderboard {
        right: 14px;
        width: 270px;
      }

      .mistake_board {
        left: 14px;
        width: 270px;
      }
    }

    @media (max-width: 620px), (max-height: 560px) {
      #startLayer.duel_layer {
        gap: 16px;
        padding: 18px 0;
        box-sizing: border-box;
      }

      #startLayer.duel_layer #startPrompt {
        font-size: 32px;
      }

      .duel_mode_panel {
        gap: 22px;
      }

      .duel_mode_card {
        grid-template-columns: minmax(104px, 1fr) 52px minmax(104px, 1fr);
        width: min(410px, calc(100vw - 28px));
        padding: 16px 14px;
        border-radius: 25px;
      }

      .duel_player_number {
        width: 60px;
        height: 60px;
        font-size: 32px;
      }

      .duel_player_label {
        font-size: 18px;
      }

      .duel_versus {
        font-size: 24px;
      }

      #startLayer.duel_layer .start_button {
        min-width: 230px;
        min-height: 70px;
        font-size: 26px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .grade_button,
      .start_button,
      .home_button {
        transition: none;
      }
    }

    @keyframes celebratePop {
      0% {
        opacity: 0;
        transform: scale(0.68) rotate(-2deg);
      }
      62% {
        opacity: 1;
        transform: scale(1.1) rotate(1deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes badgePulse {
      100% {
        transform: scale(1.1);
      }
    }

    @keyframes confettiDrop {
      0% {
        opacity: 0;
        transform: translateY(-40px) rotate(0deg);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(360px) rotate(360deg);
      }
    }

    @keyframes avatarFloat {
      100% {
        transform: translateY(-8px);
      }
    }

    @keyframes tearDrop {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.72);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(42px) scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="gameRoot">
    <canvas id="gameCanvas" width="1600" height="900"></canvas>
  </div>
  <div id="startLayer" aria-live="polite">
    <div id="startPrompt">&#36873;&#25321;&#24180;&#32423;</div>
  </div>
  <script src="game-tracker.js"></script>
  <script src="words_data.js"></script>
  <script src="play.js"></script>
</body>
</html>
