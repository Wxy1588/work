<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>你比划我来猜 - 完整版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(34, 197, 94, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(163, 230, 53, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 1;
            min-height: 0;
            height: calc(100svh / var(--fit-scale, 1));
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: clamp(16px, 3vh, 48px);
            padding-bottom: clamp(24px, 4vh, 48px);
            transform: scale(var(--fit-scale, 1));
            transform-origin: top center;
        }

        /* 装饰星星 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 封面页 */
        .cover-page {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .show-cover .cover-page {
            display: block;
        }

        .show-cover .game-page,
        .show-cover .result-page {
            display: none;
        }

        .cover-header {
            text-align: center;
            padding: 48px 0 32px;
        }

        .brand-title {
            font-size: 1.5rem;
            color: #a3e635;
            text-shadow: 0 0 20px rgba(163, 230, 53, 0.5);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .brand-title::before,
        .brand-title::after {
            content: '★';
            color: #fbbf24;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .main-title {
            font-size: 3.5rem;
            color: white;
            text-shadow: 
                0 0 10px rgba(163, 230, 53, 0.5),
                0 0 30px rgba(163, 230, 53, 0.3),
                0 4px 8px rgba(0, 0, 0, 0.3);
            margin: 0;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .title-tag {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 8px;
            display: block;
        }

        .grade-selection, .semester-selection {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .grade-selection h2, .semester-selection h2 {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 0;
            font-size: 1.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .grade-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-top: 16px;
        }

        .grade-btn {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.3) 0%, rgba(22, 163, 74, 0.3) 100%);
            border: 1px solid rgba(163, 230, 53, 0.4);
            font-size: 1.3rem;
            font-weight: bold;
            padding: 18px 0;
            border-radius: 16px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .grade-btn:hover {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.5) 0%, rgba(22, 163, 74, 0.5) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
        }

        .grade-btn:active {
            transform: translateY(0);
        }

        .grade-btn.selected {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border-color: #a3e635;
            box-shadow: 
                0 0 20px rgba(163, 230, 53, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .semester-buttons {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 16px;
        }

        .semester-btn {
            width: 45%;
            padding: 22px 0;
            font-size: 1.6rem;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .semester-btn.first {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
        }

        .semester-btn.second {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1a1a2e;
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4);
        }

        .semester-btn:hover {
            transform: translateY(-4px);
        }

        .semester-btn.selected {
            transform: scale(1.08);
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-start-cover {
            background: linear-gradient(135deg, #a3e635 0%, #84cc16 100%);
            font-size: 2rem;
            padding: 24px 72px;
            margin: 32px auto;
            display: block;
            border: none;
            border-radius: 40px;
            color: #1a1a2e;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 
                0 12px 32px rgba(163, 230, 53, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
            letter-spacing: 2px;
        }

        .btn-start-cover:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 16px 40px rgba(163, 230, 53, 0.5),
                inset 0 2px 0 rgba(255, 255, 255, 0.5);
        }

        .btn-start-cover:active {
            transform: translateY(2px);
            box-shadow: 
                0 6px 20px rgba(163, 230, 53, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.5);
        }

        /* 教程页 */
        .tutorial-page {
            display: none;
            width: 100%;
            max-height: none;
            overflow: visible;
            padding: 8px 0;
            animation: fadeIn 0.4s ease-out;
        }

        .show-tutorial-rules .cover-page,
        .show-tutorial-rules .game-page,
        .show-tutorial-rules .result-page,
        .show-tutorial-video .cover-page,
        .show-tutorial-video .game-page,
        .show-tutorial-video .result-page {
            display: none;
        }

        .show-tutorial-rules .tutorial-page,
        .show-tutorial-video .tutorial-page {
            display: block;
        }

        .tutorial-video-step {
            display: none;
        }

        .show-tutorial-video .tutorial-rules-step {
            display: none;
        }

        .show-tutorial-video .tutorial-video-step {
            display: block;
        }

        .tutorial-card {
            width: min(100%, 820px);
            margin: 0 auto;
            padding: clamp(24px, 4vw, 36px);
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .tutorial-kicker {
            margin: 0 0 8px;
            color: #fbbf24;
            text-align: center;
            font-size: 1rem;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .tutorial-title {
            margin: 0 0 28px;
            color: #fff;
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            text-shadow: 0 0 24px rgba(163, 230, 53, 0.32);
        }

        .tutorial-rules {
            display: grid;
            gap: 14px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .tutorial-rule {
            display: grid;
            grid-template-columns: 42px 1fr;
            gap: 14px;
            align-items: start;
            padding: 16px 18px;
            border-radius: 18px;
            background: rgba(8, 18, 42, 0.34);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.92);
            font-size: clamp(1rem, 2.1vw, 1.2rem);
            line-height: 1.65;
        }

        .tutorial-rule-number {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a3e635, #22c55e);
            color: #14213d;
            font-weight: 900;
        }

        .tutorial-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 22px;
        }

        .tutorial-btn {
            min-width: 190px;
            padding: 15px 28px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #a3e635 0%, #84cc16 100%);
            color: #14213d;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(163, 230, 53, 0.34), inset 0 2px 0 rgba(255,255,255,0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .tutorial-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(163, 230, 53, 0.42), inset 0 2px 0 rgba(255,255,255,0.45);
        }

        .tutorial-btn.secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .tutorial-video-wrap {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 22px;
            background: #050b1b;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
        }

        .tutorial-video-wrap video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .tutorial-hint {
            margin: 16px 0 0;
            color: rgba(255, 255, 255, 0.68);
            text-align: center;
            font-size: 0.98rem;
        }

        /* 游戏页 */
        .game-page {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .show-game .game-page {
            display: block;
        }

        .show-game .cover-page,
        .show-game .result-page {
            display: none;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-title {
            font-size: 1.5rem;
            color: white;
            margin: 0;
            font-weight: 600;
        }

        .game-stats {
            display: flex;
            gap: 28px;
        }

        .stat-item {
            text-align: center;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #a3e635;
        }

        .time-display {
            color: #f87171;
            animation: timePulse 1s infinite;
        }

        @keyframes timePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .word-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 64px 32px;
            text-align: center;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
            flex-grow: 1;
        }

        .word-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(163, 230, 53, 0.05) 0%, transparent 70%);
        }

        .word-text {
            font-size: 6.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a3e635 0%, #22c55e 50%, #84cc16 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 32px 0;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(163, 230, 53, 0.3));
            animation: wordGlow 2s ease-in-out infinite;
            line-height: 1.2;
        }

        @keyframes wordGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(163, 230, 53, 0.3)); }
            50% { filter: drop-shadow(0 0 40px rgba(163, 230, 53, 0.6)); }
        }

        .word-meaning {
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 24px;
            border-radius: 16px;
            display: inline-block;
            align-self: center;
        }

        .game-buttons {
            display: flex;
            gap: 24px;
        }

        .game-btn {
            flex: 1;
            padding: 24px 0;
            font-size: 1.6rem;
            font-weight: bold;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .btn-correct {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            box-shadow: 
                0 10px 30px rgba(34, 197, 94, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-skip {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            box-shadow: 
                0 10px 30px rgba(245, 158, 11, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .game-btn:hover {
            transform: translateY(-4px);
        }

        .game-btn:active {
            transform: translateY(2px);
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .platform-home-link {
            position: fixed;
            top: calc(84px + env(safe-area-inset-top));
            left: calc(16px + env(safe-area-inset-left));
            z-index: 10000;
            width: 74px;
            height: 54px;
            display: grid;
            place-items: center;
            border: 3px solid rgba(255, 255, 255, 0.82);
            border-radius: 18px;
            background: rgba(8, 18, 42, 0.68);
            color: #ffffff;
            font: 900 20px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-decoration: none;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.28), 0 0 22px rgba(80, 210, 255, 0.36);
            backdrop-filter: blur(10px);
            touch-action: manipulation;
        }

        .platform-home-link:active {
            transform: translateY(2px) scale(0.96);
        }

        .home-btn {
            display: none;
            position: fixed;
            top: 24px;
            left: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 100;
        }

        .home-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }

        /* 结果页 */
        .result-page {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .show-result .result-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: calc(100vh - 48px);
        }

        .show-result .cover-page,
        .show-result .game-page {
            display: none;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .result-title {
            font-size: 3rem;
            color: white;
            margin: 0 0 32px 0;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(163, 230, 53, 0.5);
        }

        .result-score {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a3e635 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 24px 0;
            filter: drop-shadow(0 0 30px rgba(163, 230, 53, 0.5));
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 64px;
            margin: 32px 0;
        }

        .result-stat {
            text-align: center;
            padding: 20px 32px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }

        .result-stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 8px;
        }

        .result-stat-label {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .result-buttons {
            display: flex;
            gap: 24px;
            margin-top: 32px;
        }

        .result-btn {
            flex: 1;
            padding: 22px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .btn-again {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            box-shadow: 
                0 10px 30px rgba(34, 197, 94, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-home {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1a1a2e;
            box-shadow: 
                0 10px 30px rgba(251, 191, 36, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.5);
        }

        .result-btn:hover {
            transform: translateY(-4px);
        }

        .result-btn:active {
            transform: translateY(2px);
        }

        /* 音乐控制 */
        .music-control {
            position: relative;
            top: auto;
            right: auto;
            width: fit-content;
            max-width: 100%;
            margin: 0 0 12px auto;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-control:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* 响应式 */
        /* 矮屏桌面：压缩间距，保证首屏能看到开始按钮 */
        @media (min-width: 769px) and (max-height: 900px) {
            .container {
                padding-top: 14px;
                padding-bottom: 20px;
            }

            .cover-header {
                padding: 22px 0 16px;
            }

            .brand-title {
                margin-bottom: 6px;
            }

            .main-title {
                font-size: clamp(2.4rem, 5vw, 3rem);
            }

            .title-tag {
                margin-top: 4px;
            }

            .grade-selection,
            .semester-selection {
                padding: 16px;
                margin-bottom: 14px;
                border-radius: 20px;
            }

            .grade-selection h2,
            .semester-selection h2 {
                margin-bottom: 10px;
                font-size: 1.35rem;
            }

            .grade-buttons,
            .semester-buttons {
                margin-top: 10px;
                gap: 10px;
            }

            .grade-btn {
                padding: 12px 0;
            }

            .semester-btn {
                padding: 14px 0;
                font-size: 1.35rem;
            }

            .btn-start-cover {
                margin: 18px auto;
                padding: 16px 48px;
                font-size: 1.55rem;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .main-title {
                font-size: 2.5rem;
            }

            .grade-buttons {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .grade-btn {
                font-size: 1.1rem;
                padding: 14px 0;
            }

            .semester-btn {

                [arr[i], arr[j]] = [arr[j], arr[i]];

                    const chord = happyChords[chordIndex % happyChords.length];
                    playNote(chord[0], time, 1, 'triangle', 0.06);
                    playNote(chord[1], time, 1, 'triangle', 0.06);
                    playNote(chord[2], time, 1, 'triangle', 0.06);
                    
                    chordIndex++;
                }
                
                if (beatCount % 4 === 1 || beatCount % 4 === 3) {
                    const note = melodyNotes[melodyIndex % melodyNotes.length];
                    playNote(note, time, 0.35, 'sine', 0.08);
                    playNote(note * 1.5, time + 0.18, 0.25, 'sine', 0.05);
                    melodyIndex += Math.floor(Math.random() * 2) + 1;
                }
                
                beatCount++;
                time += 0.25;
            }, 250);
        }
        
        function toggleMusic() {
            musicPlaying = !musicPlaying;
            const musicBtn = document.getElementById('musicBtn');
            musicBtn.textContent = musicPlaying ? '🎵 音乐 ON' : '🔇 音乐 OFF';
            
            if (musicPlaying && !bgmInterval) {
                playBGM();
            }
        }
        
        // 游戏函数
        // 按窗口尺寸缩放整个界面，避免出现滚动条或内容被裁切。
        let fitFrame = null;
        function fitToViewport() {
            const container = document.querySelector('.container');
            if (!container) return;

            // 先恢复原始比例测量当前页面的真实内容尺寸。
            container.style.setProperty('--fit-scale', '1');
            const naturalHeight = Math.max(container.scrollHeight, 1);
            const naturalWidth = Math.max(container.scrollWidth, 1);
            const availableHeight = Math.max(window.innerHeight - 8, 1);
            const availableWidth = Math.max(window.innerWidth - 16, 1);
            const scale = Math.min(1, availableHeight / naturalHeight, availableWidth / naturalWidth);

            container.style.setProperty('--fit-scale', scale.toFixed(4));
        }

        function scheduleFitToViewport() {
            if (fitFrame) cancelAnimationFrame(fitFrame);
            fitFrame = requestAnimationFrame(function() {
                fitFrame = null;
                fitToViewport();
            });
        }

        // Tutorial flow: rules first, then the demonstration video.
        function showTutorialRules() {
            document.body.className = 'show-tutorial-rules';
            scheduleFitToViewport();
        }

        function showTutorialVideo() {
            document.body.className = 'show-tutorial-video';
            scheduleFitToViewport();
            const teachVideo = document.getElementById('teachVideo');
            teachVideo.currentTime = 0;
            const playPromise = teachVideo.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {
                    // If autoplay is blocked, the native controls remain available.
                });
            }
        }

        function returnToCoverFromTutorial() {
            const teachVideo = document.getElementById('teachVideo');
            teachVideo.pause();
            document.body.className = 'show-cover';
            scheduleFitToViewport();
        }

        function startGame() {
            const wordBank = WORD_BANK[selectedSemester][selectedGrade];
            if (!wordBank || wordBank.length === 0) {
                alert('该年级学期暂无词汇');
                return;
            }
            window.gameTracker.start();
            
            currentWords = shuffle(wordBank);
            currentWordIndex = 0;
            score = 0;
            timeLeft = 120;
            
            // 更新界面
            document.getElementById('gameTitle').textContent = selectedGrade + '年级 ' + (selectedSemester === 'first' ? '上册' : '下册');
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft;
            
            // 切换到游戏页
            document.body.className = 'show-game';
            scheduleFitToViewport();

            const teachVideo = document.getElementById('teachVideo');
            if (teachVideo) teachVideo.pause();
            
            // 显示第一个单词
            showWord();
            
            // 开始计时
            timer = setInterval(function() {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
            
            // 开始音乐
            if (!bgmInterval && musicPlaying) {
                playBGM();
            }
        }
        
        function showWord() {
            if (currentWordIndex >= currentWords.length) {
                endGame();
                return;
            }
            
            const word = currentWords[currentWordIndex];
            document.getElementById('currentWord').textContent = word.word;
            document.getElementById('currentMeaning').textContent = '提示: ' + word.meaning;
        }
        
        function handleCorrect() {
            score += 1;
            document.getElementById('score').textContent = score;
            currentWordIndex++;
            showWord();
        }
        
        function handleSkip() {
            currentWordIndex++;
            showWord();
        }
        
        function endGame() {
            clearInterval(timer);
            window.gameTracker.finish(score);
            
            const correctCount = score;
            const totalCount = currentWordIndex;
            
            document.getElementById('resultScore').textContent = score + ' 分';
            document.getElementById('resultCorrect').textContent = correctCount;
            document.getElementById('resultTotal').textContent = totalCount;
            
            document.body.className = 'show-result';
            scheduleFitToViewport();
        }
        
        function goHome() {
            window.gameTracker.abandon();
            history.back();
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化年级按钮
            const gradeButtons = document.getElementById('gradeButtons');
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'grade-btn';
                btn.textContent = i + '年级';
                btn.addEventListener('click', function() {
                    selectedGrade = i;
                    document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
                if (i === 1) btn.classList.add('selected');
                gradeButtons.appendChild(btn);
            }
            
            // 初始化学期按钮
            document.getElementById('firstSemester').addEventListener('click', function() {
                selectedSemester = 'first';
                document.querySelectorAll('.semester-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
            });
            
            document.getElementById('secondSemester').addEventListener('click', function() {
                selectedSemester = 'second';
                document.querySelectorAll('.semester-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
            });
            
            // 初始化游戏按钮
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('tutorialVideoBtn').addEventListener('click', showTutorialVideo);
            document.getElementById('tutorialStartBtn').addEventListener('click', returnToCoverFromTutorial);
            document.getElementById('tutorialBackBtn').addEventListener('click', returnToCoverFromTutorial);
            document.getElementById('tutorialRulesBtn').addEventListener('click', function() {
                document.getElementById('teachVideo').pause();
                document.body.className = 'show-tutorial-rules';
            });
            document.getElementById('homeBtn').addEventListener('click', goHome);
            document.getElementById('correctBtn').addEventListener('click', handleCorrect);
            document.getElementById('skipBtn').addEventListener('click', handleSkip);
            document.getElementById('againBtn').addEventListener('click', startGame);
            document.getElementById('backHomeBtn').addEventListener('click', goHome);
            document.getElementById('musicBtn').addEventListener('click', toggleMusic);

            window.addEventListener('resize', scheduleFitToViewport);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', scheduleFitToViewport);
            }
            scheduleFitToViewport();
        });
    </script>
</body>
</html>
